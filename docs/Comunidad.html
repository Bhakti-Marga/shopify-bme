document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Nunito Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"6164e278-6ea7-4be9-9c9a-af8abb88003d\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Nunito Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"6207e9ab-022d-4f41-8c7b-d5b988eeb33d\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Nunito Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"d4ec6fbc-a9ce-4906-9f5d-34f0fa70fb5a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root {\n    --navy: #14224a;\n    --navy-deep: #0f1a3a;\n    --gold: #c9b377;\n    --cream: #f4efe5;\n    --cream-soft: #f8f4ec;\n    --ink: #14224a;\n    --muted: #5a6378;\n    --rule: rgba(20, 34, 74, 0.12);\n    --font: \"Avenir Next\", \"Nunito Sans\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif;\n    --font-serif: \"Cormorant Garamond\", Georgia, serif;\n  }\n\n  * { box-sizing: border-box; }\n  #__bundler_err { display: none !important; }\n  html, body { margin: 0; padding: 0; }\n  body {\n    font-family: var(--font);\n    font-size: 16px;\n    line-height: 1.55;\n    color: var(--ink);\n    background: #fff;\n    -webkit-font-smoothing: antialiased;\n    text-rendering: optimizeLegibility;\n  }\n\n  img { max-width: 100%; display: block; }\n\n  /* ---------- Header ---------- */\n  .site-header {\n    background: var(--navy);\n    color: #fff;\n  }\n  .header-inner {\n    max-width: 1440px;\n    margin: 0 auto;\n    padding: 28px 56px;\n    display: grid;\n    grid-template-columns: 1fr auto 1fr;\n    align-items: center;\n    gap: 32px;\n  }\n  .brand {\n    font-family: var(--font-serif);\n    font-size: 28px;\n    font-style: italic;\n    letter-spacing: 0.2px;\n    color: #fff;\n    text-decoration: none;\n    line-height: 1;\n  }\n  .brand .b1 { font-weight: 600; }\n  .brand .b2 { font-weight: 600; }\n\n  .nav {\n    display: flex;\n    gap: 44px;\n    align-items: center;\n    justify-content: center;\n  }\n  .nav a {\n    color: #fff;\n    text-decoration: none;\n    font-size: 16px;\n    display: inline-flex;\n    align-items: center;\n    gap: 6px;\n    opacity: 0.95;\n  }\n  .nav a:hover { opacity: 1; }\n  .caret {\n    width: 8px; height: 8px;\n    border-right: 1.5px solid currentColor;\n    border-bottom: 1.5px solid currentColor;\n    transform: rotate(45deg) translateY(-2px);\n    display: inline-block;\n  }\n\n  .header-right {\n    display: flex;\n    align-items: center;\n    gap: 28px;\n    justify-content: flex-end;\n  }\n  .icon-btn {\n    background: none;\n    border: 0;\n    color: #fff;\n    cursor: pointer;\n    padding: 6px;\n    line-height: 0;\n  }\n  .signin {\n    color: #fff;\n    text-decoration: none;\n    font-size: 16px;\n  }\n\n  /* ---------- Hero ---------- */\n  .hero {\n    background: var(--navy);\n    color: #fff;\n    text-align: center;\n    padding: 96px 24px 140px;\n  }\n  .hero-inner {\n    max-width: 1100px;\n    margin: 0 auto;\n  }\n  .eyebrow {\n    color: var(--gold);\n    font-size: 16px;\n    font-weight: 600;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    margin: 0 0 28px;\n  }\n  h1.h1 {\n    font-family: var(--font);\n    font-size: 88px;\n    line-height: 1.02;\n    letter-spacing: -0.02em;\n    font-weight: 600;\n    margin: 0 0 32px;\n    color: #fff;\n  }\n  .hero p.lede {\n    font-size: 16px;\n    line-height: 1.7;\n    max-width: 640px;\n    margin: 0 auto 40px;\n    color: rgba(255,255,255,0.88);\n  }\n  .btn {\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    padding: 16px 36px;\n    border-radius: 999px;\n    font-size: 16px;\n    font-weight: 600;\n    letter-spacing: 0.16em;\n    text-transform: uppercase;\n    text-decoration: none;\n    border: 1.5px solid transparent;\n    cursor: pointer;\n    transition: background .18s ease, color .18s ease, border-color .18s ease;\n    font-family: var(--font);\n  }\n  .btn-ghost {\n    color: #fff;\n    border-color: rgba(255,255,255,0.85);\n    background: transparent;\n  }\n  .btn-ghost:hover { background: #fff; color: var(--navy); }\n  .btn-solid {\n    background: var(--navy);\n    color: #fff;\n    border-color: var(--navy);\n  }\n  .btn-solid:hover { background: var(--navy-deep); }\n\n  /* ---------- Welcome lockup ---------- */\n  .welcome {\n    background: var(--cream-soft);\n    text-align: center;\n    padding: 120px 24px 100px;\n  }\n  .welcome h2 {\n    font-family: var(--font);\n    font-size: 56px;\n    line-height: 1.15;\n    letter-spacing: -0.01em;\n    font-weight: 700;\n    margin: 0 auto;\n    max-width: 1100px;\n    color: var(--ink);\n    text-wrap: balance;\n  }\n  .welcome h2 em {\n    font-style: italic;\n    font-weight: 500;\n  }\n\n  /* ---------- Photo grid ---------- */\n  .gallery {\n    background: var(--cream-soft);\n    padding: 0 24px 120px;\n  }\n  .gallery-inner {\n    max-width: 1280px;\n    margin: 0 auto;\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 24px;\n  }\n  .photo {\n    aspect-ratio: 4 / 3;\n    background: #d9dde6;\n    border-radius: 4px;\n    display: flex;\n    align-items: flex-start;\n    justify-content: center;\n    padding-top: 12px;\n    color: #8a92a3;\n    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;\n    font-size: 12px;\n    overflow: hidden;\n    position: relative;\n  }\n  .photo .grid-image {\n    position: absolute;\n    inset: 0;\n    width: 100%;\n    height: 100%;\n    object-fit: cover;\n    display: block;\n  }\n  .photo .grid-image[src=\"\"] { display: none; }\n    text-align: center;\n    line-height: 1.4;\n  }\n\n  /* ---------- Reuniones (Visit Temple) ---------- */\n  .reuniones {\n    background: #fff;\n    padding: 140px 24px 140px;\n    text-align: center;\n  }\n  .reuniones-inner {\n    max-width: 720px;\n    margin: 0 auto;\n    text-align: center;\n  }\n  .reuniones .group h3,\n  .reuniones .group p,\n  .reuniones .group { text-align: center; }\n  .reuniones .kicker {\n    font-size: 16px;\n    line-height: 1.6;\n    color: var(--ink);\n    margin: 0 0 28px;\n    font-weight: 500;\n  }\n  .reuniones h2 {\n    font-family: var(--font);\n    font-size: 88px;\n    line-height: 1.02;\n    letter-spacing: -0.02em;\n    font-weight: 700;\n    margin: 0 0 72px;\n    color: var(--ink);\n  }\n  .reuniones .group {\n    margin: 0 0 40px;\n  }\n  .reuniones .group h3 {\n    font-family: var(--font);\n    font-size: 18px;\n    font-weight: 700;\n    font-style: italic;\n    margin: 0 0 12px;\n    color: var(--ink);\n  }\n  .reuniones .group p {\n    margin: 0;\n    font-size: 16px;\n    font-style: italic;\n    color: var(--ink);\n    line-height: 1.7;\n  }\n  .reuniones a.inline {\n    color: var(--ink);\n    font-weight: 700;\n    font-style: italic;\n    text-decoration: underline;\n    text-underline-offset: 3px;\n  }\n  .reuniones .stay {\n    margin-top: 8px;\n  }\n  .reuniones .stay strong {\n    display: block;\n    font-weight: 700;\n    margin-bottom: 8px;\n  }\n\n  /* ---------- Conectemos form ---------- */\n  .connect {\n    background: #fff;\n    padding: 0 24px 140px;\n    text-align: center;\n  }\n  .connect-inner {\n    max-width: 720px;\n    margin: 0 auto;\n  }\n  .connect .eyebrow {\n    color: var(--gold);\n  }\n  .connect h2 {\n    font-family: var(--font);\n    font-size: 56px;\n    line-height: 1.1;\n    letter-spacing: -0.01em;\n    font-weight: 700;\n    margin: 0 0 24px;\n    color: var(--ink);\n  }\n  .connect p.sub {\n    font-size: 16px;\n    line-height: 1.7;\n    color: var(--muted);\n    max-width: 580px;\n    margin: 0 auto 56px;\n  }\n  .form-card {\n    background: var(--cream);\n    border-radius: 14px;\n    padding: 56px 56px 48px;\n    text-align: left;\n  }\n  .field-row {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 24px;\n    margin-bottom: 28px;\n  }\n  .field label {\n    display: block;\n    font-size: 16px;\n    font-weight: 600;\n    letter-spacing: 0.14em;\n    text-transform: uppercase;\n    color: #6b6357;\n    margin-bottom: 12px;\n  }\n  .field input,\n  .field textarea {\n    width: 100%;\n    padding: 16px 20px;\n    border: 1px solid rgba(20, 34, 74, 0.18);\n    border-radius: 10px;\n    background: #fff;\n    font: 400 16px/1.5 var(--font);\n    color: var(--ink);\n    outline: none;\n    transition: border-color .15s ease, box-shadow .15s ease;\n  }\n  .field input::placeholder,\n  .field textarea::placeholder { color: #b6b3ad; }\n  .field input:focus,\n  .field textarea:focus {\n    border-color: var(--navy);\n    box-shadow: 0 0 0 3px rgba(20, 34, 74, 0.08);\n  }\n  .field textarea {\n    min-height: 140px;\n    resize: vertical;\n  }\n  .field.full { margin-bottom: 32px; }\n  .submit {\n    width: 100%;\n    padding: 20px;\n    background: var(--navy);\n    color: #fff;\n    border: 0;\n    border-radius: 10px;\n    font: 600 16px/1 var(--font);\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    cursor: pointer;\n    transition: background .15s ease;\n  }\n  .submit:hover { background: var(--navy-deep); }\n  .form-note {\n    margin: 24px auto 0;\n    text-align: center;\n    font-size: 14px;\n    color: #8a8275;\n    line-height: 1.6;\n    max-width: 520px;\n  }\n\n  /* ---------- Footer ---------- */\n  .footer {\n    background: var(--navy);\n    color: #fff;\n    padding: 80px 56px 48px;\n  }\n  .footer-grid {\n    max-width: 1440px;\n    margin: 0 auto;\n    display: grid;\n    grid-template-columns: repeat(6, 1fr);\n    gap: 32px;\n    text-align: left;\n  }\n  .footer h4 {\n    font-family: var(--font);\n    font-size: 16px;\n    font-weight: 700;\n    margin: 0 0 18px;\n    color: #fff;\n  }\n  .footer ul {\n    list-style: none;\n    padding: 0;\n    margin: 0;\n    display: flex;\n    flex-direction: column;\n    gap: 10px;\n  }\n  .footer a {\n    color: rgba(255,255,255,0.78);\n    text-decoration: none;\n    font-size: 14px;\n  }\n  .footer a:hover { color: #fff; }\n  .footer-bottom {\n    max-width: 1440px;\n    margin: 56px auto 0;\n    padding-top: 28px;\n    border-top: 1px solid rgba(255,255,255,0.12);\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    color: rgba(255,255,255,0.6);\n    font-size: 13px;\n  }\n\n  /* ---------- Responsive ---------- */\n  @media (max-width: 900px) {\n    .header-inner { grid-template-columns: 1fr auto; }\n    .nav { display: none; }\n    .hero { padding: 64px 20px 88px; }\n    h1.h1 { font-size: 56px; }\n    .welcome { padding: 80px 20px 60px; }\n    .welcome h2 { font-size: 36px; }\n    .gallery-inner { grid-template-columns: 1fr; }\n    .reuniones { padding: 88px 20px; }\n    .reuniones h2 { font-size: 56px; margin-bottom: 48px; }\n    .connect h2 { font-size: 36px; }\n    .form-card { padding: 32px 24px; }\n    .field-row { grid-template-columns: 1fr; }\n    .footer-grid { grid-template-columns: 1fr 1fr; }\n    .footer-bottom { flex-direction: column; gap: 12px; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body style=\"\">\n\n  \n\n  <!-- HERO -->\n  <section class=\"hero\" data-screen-label=\"Hero\">\n    <div class=\"hero-inner\">\n      <p class=\"eyebrow\" style=\"\">SANGHA<\u002Fp>\n      <h1 class=\"h1\" style=\"font-weight: 600;\">Comunidad Valencia<\u002Fh1>\n      <p class=\"lede\" style=\"font-weight: 500; font-size: 17px;\">Comunidad Bhakti Marga Valencia. Conecta con almas afines, encuentra eventos y ponte en contacto con nosotros.<\u002Fp>\n      <a class=\"btn btn-ghost\" href=\"#conectemos\" style=\"font-size: 16px; line-height: 1; width: 160px; padding: 16px 20px; text-transform: none; letter-spacing: 0\">Contáctanos<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- WELCOME -->\n  <section class=\"welcome\" data-screen-label=\"Bienvenida\" style=\"background-color: rgb(255, 255, 255);\">\n    <h2 style=\"line-height: 1\"><strong style=\"font-size: 40px; font-weight: 400;\">No importa en qué punto de tu camino espiritual estés,<\u002Fstrong> <em style=\"font-size: 40px; font-weight: 700;\">eres bienvenido aquí.<\u002Fem><\u002Fh2>\n  <\u002Fsection>\n\n  <!-- PHOTO GRID -->\n  <!-- IMAGE GRID — replace each <img> src with a Shopify image. 6 images, ~1:1 aspect ratio recommended. -->\n  <section class=\"gallery\" data-screen-label=\"Galería\" style=\"background-color: rgb(255, 255, 255);\">\n    <div class=\"gallery-inner image-grid\" role=\"list\" aria-label=\"Galería de imágenes de la comunidad\">\n      <!-- Image 1 -->\n      <div class=\"photo image-grid__item\" role=\"listitem\">\n        <img class=\"grid-image\" src=\"\" alt=\"Foto comunidad 1\" data-shopify-image-slot=\"gallery-1\">\n      <\u002Fdiv>\n      <!-- Image 2 -->\n      <div class=\"photo image-grid__item\" role=\"listitem\">\n        <img class=\"grid-image\" src=\"\" alt=\"Foto comunidad 2\" data-shopify-image-slot=\"gallery-2\">\n      <\u002Fdiv>\n      <!-- Image 3 -->\n      <div class=\"photo image-grid__item\" role=\"listitem\">\n        <img class=\"grid-image\" src=\"\" alt=\"Foto comunidad 3\" data-shopify-image-slot=\"gallery-3\">\n      <\u002Fdiv>\n      <!-- Image 4 -->\n      <div class=\"photo image-grid__item\" role=\"listitem\">\n        <img class=\"grid-image
